<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>$SKEETERCAT</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@700&display=swap');
  body { margin:0; background:radial-gradient(ellipse at top, #ff8c00 0%, #111 50%, #000 100%); color:white; font-family:Inter,sans-serif; text-align:center; min-height:100vh; display:flex; flex-direction:column; align-items:center; }
  .logo-box { margin-top:50px; background:white; border-radius:30px; padding:12px 12px 0 12px; border:4px solid #ff8c00; box-shadow:0 0 30px rgba(255,140,0,.5); }
  .logo-box img { width:160px; border-radius:20px; display:block; }
  h1 { font-family:'Fredoka',sans-serif; font-size:38px; color:#ff8c00; margin:25px 10px 10px; text-shadow:0 3px 0 #000; letter-spacing:1px; line-height:1; }
  .tagline { max-width:340px; padding:0 20px; color:#ccc; font-size:16px; line-height:1.5; margin-bottom:28px; }
  .btn { display:block; width:260px; padding:16px; margin:12px auto; border-radius:999px; font-weight:900; font-size:16px; cursor:pointer; border:none; }
  .btn-primary { background:#ff8c00; color:black; }
  footer { margin-top:50px; padding:30px; color:#555; font-size:13px; }
</style>
</head>
<body>
  <div class="logo-box"><img src="logo.png"></div>
  <h1>$SKEETERCAT</h1>
  <div class="tagline">🦟 Click BUY to hear the SKEETER!</div>
  <button id="buyBtn" class="btn btn-primary">🔊 BUY ON PUMP.FUN</button>
  <footer>© 2026 SKEETERCAT</footer>

<script>
let ctx;
function realMosquito(){
  if(!ctx) ctx = new (window.AudioContext||window.webkitAudioContext)();
  const now = ctx.currentTime;
  const dur = 2.8;
  
  // 2 wing oscillators biar kayak nyamuk beneran
  for(let i=0;i<2;i++){
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    const filter = ctx.createBiquadFilter();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(190 + i*5, now);
    // bikin naik turun kayak nyamuk terbang deket kuping
    osc.frequency.linearRampToValueAtTime(480, now+0.4);
    osc.frequency.linearRampToValueAtTime(420, now+0.9);
    osc.frequency.linearRampToValueAtTime(550, now+1.6);
    osc.frequency.linearRampToValueAtTime(350, now+dur);
    
    filter.type='bandpass';
    filter.frequency.value=1000;
    
    gain.gain.setValueAtTime(0, now);
    gain.gain.linearRampToValueAtTime(0.25, now+0.1);
    gain.gain.setValueAtTime(0.25, now+dur-0.3);
    gain.gain.exponentialRampToValueAtTime(0.001, now+dur);
    
    osc.connect(filter); filter.connect(gain); gain.connect(ctx.destination);
    osc.start(now); osc.stop(now+dur);
  }
}
document.getElementById('buyBtn').addEventListener('click',()=>{
  realMosquito();
  setTimeout(()=>window.open('https://pump.fun','_blank'), 1000);
});
// unlock audio on first touch
document.body.addEventListener('touchstart', ()=>{ if(!ctx) ctx = new (window.AudioContext||window.webkitAudioContext)(); }, {once:true});
</script>
</body>
</html>
