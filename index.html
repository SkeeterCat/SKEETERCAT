<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>$SKEETERCAT</title>
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=JetBrains+Mono:wght@800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#FFD600;color:#000;font-family:'JetBrains Mono',monospace}
.wrap{max-width:680px;margin:0 auto;padding:16px}
h1{font-family:'Bangers',cursive;font-size:82px;letter-spacing:2px;text-align:center;line-height:.9;margin-top:20px;text-shadow:5px 0 #FF00FF}
@media(max-width:500px){h1{font-size:62px}}
.pill{background:#000;color:#FFD600;text-align:center;padding:8px 12px;font-size:12px;letter-spacing:2px;margin:12px auto;width:fit-content;transform:rotate(-1deg)}
.card{background:#fff;border:4px solid #000;border-radius:24px;overflow:hidden;box-shadow:10px 10px 0 #000;margin:18px 0}
.card img{width:100%;display:block;background:#fff}
.ca{background:#000;color:#fff;border:4px solid #000;border-radius:16px;padding:14px;display:flex;justify-content:space-between;align-items:center;gap:10px;box-shadow:8px 8px 0 #000;margin:18px 0}
.ca b{color:#FFD600;font-size:13px;word-break:break-all}
.copy{background:#FFD600;border:3px solid #000;padding:12px 16px;font-weight:900;cursor:pointer;box-shadow:4px 4px 0 #000}
.btn{display:block;text-align:center;text-decoration:none;border:4px solid #000;border-radius:14px;padding:18px;font-weight:900;font-size:18px;box-shadow:8px 8px 0 #000;margin:12px 0}
.buy{background:#00FF88;color:#000}
.dex{background:#fff;color:#000}
.foot{text-align:center;opacity:.6;margin:30px 0 10px;font-size:11px}
</style>
</head>
<body>
<div class="wrap">
<h1>$SKEETERCAT</h1>
<div class="pill">SPRAY. SKATE. PUMP.</div>

<div class="card">
